services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app/backend
      - ./backend/app/db:/app/backend/app/db
      - ./data:/app/data

    environment:
      - PYTHONPATH=/app/backend

    env_file:
      - .env

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    volumes:
      # sync code
      - ./frontend:/app
      # IMPORTANT: preserve node_modules inside container
      - /app/node_modules

    environment:
      - VITE_API_URL=http://localhost:8000

    depends_on:
      - backend

    restart: unless-stopped